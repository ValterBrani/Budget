<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget</title>
  <meta name="description" content="Budget personnel simple : saisie express des revenus et dépenses, import des relevés CSV CIBC et Wealthsimple. Les données restent dans le navigateur.">
  <meta name="theme-color" content="#1d5a42">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/accueil"><img src="icon.svg" alt="" width="26" height="26">Budget</a>
      <nav class="tabs" aria-label="Sections">
        <a href="#/accueil" data-view="dashboard" data-ico="house"><span>Accueil</span></a>
        <a href="#/transactions" data-view="transactions" data-ico="list"><span>Opérations</span></a>
        <a href="#/budgets" data-view="budgets" data-ico="mail"><span>Budgets</span></a>
        <a href="#/reglages" data-view="settings" data-ico="settings"><span>Réglages</span></a>
      </nav>
      <div class="month-nav">
        <button type="button" class="icon-btn" data-action="prev-month" aria-label="Mois précédent" data-ico="chevron-left"></button>
        <h1 id="monthLabel" aria-live="polite"></h1>
        <button type="button" class="icon-btn" data-action="next-month" aria-label="Mois suivant" data-ico="chevron-right"></button>
      </div>
      <button type="button" class="btn btn-import" data-action="open-import" data-ico="upload">Importer<span class="hide-sm">&nbsp;un CSV</span></button>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="wrap foot muted small">
    Tes données restent dans ce navigateur. Rien n'est envoyé sur Internet.
  </footer>

  <dialog id="importDlg" aria-label="Importer un relevé"></dialog>
  <dialog id="editDlg" aria-label="Modifier l'opération"></dialog>
  <dialog id="iconDlg" aria-label="Choisir une icône"></dialog>
  <div id="toast" popover="manual" role="status" aria-live="polite"></div>
  <div id="dropOverlay" aria-hidden="true"><span>Dépose ton relevé CSV pour l'importer</span></div>

  <noscript><p class="wrap">Cette application a besoin de JavaScript.</p></noscript>
  <script src="js/csv.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/banks.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
