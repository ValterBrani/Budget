<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget</title>
  <meta name="description" content="Budget personnel simple : saisie express des revenus et dépenses, import des relevés CSV CIBC et Wealthsimple. Les données restent dans le navigateur.">
  <meta name="theme-color" content="#1d5a42">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/accueil"><img src="icon.svg" alt="" width="26" height="26">Budget</a>
      <nav class="tabs" aria-label="Sections">
        <a href="#/accueil" data-view="dashboard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></a>
        <a href="#/transactions" data-view="transactions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Opérations</span></a>
        <a href="#/budgets" data-view="budgets"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>Budgets</span></a>
        <a href="#/reglages" data-view="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Réglages</span></a>
      </nav>
      <div class="month-nav">
        <button type="button" class="icon-btn" data-action="prev-month" aria-label="Mois précédent"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <h1 id="monthLabel" aria-live="polite"></h1>
        <button type="button" class="icon-btn" data-action="next-month" aria-label="Mois suivant"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <button type="button" class="btn btn-import" data-action="open-import">Importer<span class="hide-sm">&nbsp;un CSV</span></button>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="wrap foot muted small">
    Tes données restent dans ce navigateur. Rien n'est envoyé sur Internet.
  </footer>

  <dialog id="importDlg" aria-label="Importer un relevé"></dialog>
  <dialog id="editDlg" aria-label="Modifier l'opération"></dialog>
  <div id="toast" popover="manual" role="status" aria-live="polite"></div>
  <div id="dropOverlay" aria-hidden="true"><span>Dépose ton relevé CSV pour l'importer</span></div>

  <noscript><p class="wrap">Cette application a besoin de JavaScript.</p></noscript>
  <script src="js/csv.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/banks.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
